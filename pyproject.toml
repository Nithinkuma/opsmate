[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmate"
version = "0.1.0"
description = "AI-powered Kubernetes operations assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "openai>=2.33.0",
    "typer>=0.25.0",
    "rich>=15.0.0",
    "pydantic>=2.0",
    "httpx>=0.28.0",
]

[project.scripts]
opsmate = "opsmate.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["opsmate*"]
